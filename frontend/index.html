<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMIK KITA — Baca Komik Premium</title>
<meta name="description" content="Baca ribuan komik terbaru setiap hari — koleksi premium, update cepat, pengalaman membaca terbaik.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0e;
  --bg-2:#101015;
  --surface:#16161c;
  --line:rgba(255,255,255,.09);
  --line-soft:rgba(255,255,255,.05);
  --gold:#c9a227;
  --gold-soft:#e3c766;
  --gold-ink:#1a1505;
  --text:#ece9e2;
  --muted:#8f8b80;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Manrope',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
::selection{background:var(--gold);color:var(--gold-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a32;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
img{display:block}
button{font-family:inherit;cursor:pointer}

/* ============ NAVBAR ============ */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(11,11,14,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.nav-inner{max-width:1320px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;text-decoration:none;flex-shrink:0}
.brand .word{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--text)}
.brand .word em{font-style:italic;color:var(--gold)}
.brand .dot{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);align-self:center}
.nav-menu{display:flex;gap:4px;flex:1}
.nav-btn{
  background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;
  letter-spacing:1.6px;text-transform:uppercase;padding:10px 14px;position:relative;transition:color .25s;
}
.nav-btn::after{content:'';position:absolute;left:14px;right:14px;bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--gold-soft)}
.nav-btn.active::after{transform:scaleX(1)}
.search-wrap{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);transition:border-color .3s}
.menu-search{display:none}
.search-wrap:focus-within{border-color:var(--gold)}
.search-wrap input{background:none;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:13.5px;padding:9px 14px;width:180px}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap button{background:none;border:none;color:var(--muted);padding:0 14px;font-size:14px;transition:color .25s}
.search-wrap button:hover{color:var(--gold)}
.hamburger{display:none;background:rgba(201,162,39,.16);border:1px solid var(--gold);width:44px;height:44px;flex-shrink:0;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:0}
.hamburger span{display:block;width:22px;height:2px;background:var(--gold-soft);box-shadow:0 0 0 1px rgba(227,199,102,.08)}
.hamburger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger[aria-expanded="true"] span:nth-child(2){opacity:0}
.hamburger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.hamburger span{transition:transform .2s,opacity .2s}

/* ============ LAYOUT ============ */
.container{max-width:1320px;margin:0 auto;padding:96px 24px 60px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:52px 0 24px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.section-head h2{font-family:var(--serif);font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:.3px}
.section-head h2 em{font-style:italic;color:var(--gold)}
.section-head .count{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

/* ============ HERO ============ */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;padding:24px 0 12px;min-height:340px}
.hero .eyebrow{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:12px}
.hero .eyebrow::before{content:'';width:34px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-size:clamp(38px,5.4vw,64px);font-weight:500;line-height:1.06;letter-spacing:-.5px}
.hero h1 em{font-style:italic;color:var(--gold-soft)}
.hero p{margin-top:20px;color:var(--muted);font-size:15.5px;line-height:1.75;max-width:520px}
.hero-cta{display:flex;gap:14px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:1px solid transparent;transition:all .3s}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-gold:hover{background:var(--gold-soft)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.hero-side{border-left:1px solid var(--line-soft);padding-left:36px}
.hero-stats{display:flex;flex-direction:column;gap:22px}
.stat .num{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--gold-soft)}
.stat .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.card{cursor:pointer;position:relative;background:transparent;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.card:hover{transform:translateY(-6px)}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface);border:1px solid var(--line-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1),filter .4s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,11,14,.85));opacity:0;transition:opacity .35s}
.card:hover .thumb::after{opacity:1}
.rank{position:absolute;top:10px;left:10px;z-index:2;font-family:var(--serif);font-style:italic;font-size:13px;background:var(--gold);color:var(--gold-ink);padding:3px 10px;font-weight:700}
.chip{position:absolute;top:10px;right:10px;z-index:2;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:rgba(11,11,14,.8);backdrop-filter:blur(6px);color:var(--gold-soft);border:1px solid rgba(201,162,39,.4);padding:4px 9px}
.card-meta{padding:12px 2px 0}
.card-meta h3{font-size:14px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .25s}
.card:hover .card-meta h3{color:var(--gold-soft)}
.card-meta .sub{margin-top:5px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card-meta .sub i{color:var(--gold);font-size:10px}

/* ============ GENRE ============ */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.genre-tile{position:relative;padding:26px 22px;border:1px solid var(--line-soft);background:var(--bg-2);cursor:pointer;overflow:hidden;transition:border-color .3s}
.genre-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);transform:scaleY(0);transition:transform .35s;transform-origin:bottom}
.genre-tile:hover{border-color:rgba(201,162,39,.45)}
.genre-tile:hover::before{transform:scaleY(1)}
.genre-tile .gname{font-family:var(--serif);font-size:20px;font-weight:600}
.genre-tile .gcount{margin-top:6px;font-size:11.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.genre-tile i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;transition:all .3s}
.genre-tile:hover i{color:var(--gold);right:14px}

/* ============ HISTORY LIST ============ */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .25s,padding-left .25s}
.row:hover{background:rgba(201,162,39,.04);padding-left:12px}
.row img{width:64px;height:84px;object-fit:cover;border:1px solid var(--line-soft)}
.row .rtitle{font-size:15px;font-weight:700}
.row .rsub{margin-top:5px;font-size:12px;color:var(--muted)}
.row .go{color:var(--muted);font-size:14px}
.row:hover .go{color:var(--gold)}

/* ============ DETAIL ============ */
.detail{display:grid;grid-template-columns:280px 1fr;gap:44px}
.detail-cover{position:relative}
.detail-cover img{width:100%;border:1px solid var(--line)}
.detail-cover::after{content:'';position:absolute;inset:0;transform:translate(12px,12px);border:1px solid var(--gold);z-index:-1;opacity:.5}
.detail h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,40px);font-weight:600;line-height:1.15}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.badge{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:6px 12px}
.badge.gold{border-color:rgba(201,162,39,.5);color:var(--gold-soft)}
.detail .desc{color:var(--muted);font-size:14.5px;line-height:1.8;max-width:640px}
.chapters{margin-top:36px}
.chapters h3{font-family:var(--serif);font-size:22px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.ch-item{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-soft);font-size:14px;cursor:pointer;transition:all .25s}
.ch-item:hover{color:var(--gold-soft);padding-left:12px}
.ch-item .num{color:var(--muted);font-size:12px;letter-spacing:1px}
.back-link{background:none;border:none;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:26px;display:inline-flex;gap:10px;align-items:center;transition:color .25s}
.back-link:hover{color:var(--gold)}

/* ============ READER ============ */
.reader{max-width:820px;margin:0 auto}
.reader-head{text-align:center;margin-bottom:28px}
.reader-head h2{font-family:var(--serif);font-size:26px;font-weight:600}
.reader-head p{color:var(--muted);font-size:12.5px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
.reader img{width:100%;margin-bottom:2px;background:var(--surface)}
.reader-nav{display:flex;justify-content:space-between;gap:12px;margin:32px 0}

/* ============ STATES ============ */
.loading,.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.loader-mark{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.empty i{font-size:34px;color:var(--gold);opacity:.6;margin-bottom:16px}
.empty p{font-size:14px}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--line-soft);margin-top:80px;padding:40px 24px;text-align:center}
footer .fword{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold)}
footer p{color:var(--muted);font-size:12px;margin-top:10px;letter-spacing:1px}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:30px}
  .hero-side{border-left:none;padding-left:0;border-top:1px solid var(--line-soft);padding-top:24px}
  .hero-stats{flex-direction:row;gap:36px}
  .detail{grid-template-columns:1fr}
  .detail-cover{max-width:240px}
  .nav-menu{display:none;position:fixed;top:68px;left:0;right:0;background:var(--bg-2);border-bottom:1px solid var(--line);flex-direction:column;padding:12px 24px 20px;z-index:99}
  .nav-menu.open{display:flex}
  .nav-btn{text-align:left;font-size:14px;padding:14px 10px;border-bottom:1px solid var(--line-soft)}
  .hamburger{display:inline-flex;margin-left:auto}
  .nav-search{display:none}
  .menu-search{display:flex;margin:4px 0 10px}
  .menu-search input{flex:1;width:auto}
}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px}
  .container{padding:88px 16px 60px}
  .nav-inner{padding:0 16px;gap:12px}
  .hero h1{font-size:34px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" onclick="loadView('home')">
      <span class="word">KOMIK <em>Kita</em></span>
      <span class="dot"></span>
    </a>
    <div class="nav-menu" id="navMenu">
      <div class="search-wrap menu-search">
        <input id="searchInputMobile" placeholder="Cari komik..." onkeydown="if(event.key==='Enter')doSearchMobile()">
        <button onclick="doSearchMobile()" aria-label="Cari"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <button class="nav-btn active" onclick="loadView('home')">Beranda</button>
      <button class="nav-btn" onclick="loadView('populer')">Populer</button>
      <button class="nav-btn" onclick="loadView('terbaru')">Terbaru</button>
      <button class="nav-btn" onclick="loadView('pustaka')">Pustaka</button>
      <button class="nav-btn" onclick="loadView('genre')">Genre</button>
      <button class="nav-btn" onclick="loadView('riwayat')">Riwayat</button>
    </div>
    <div class="search-wrap nav-search">
      <input id="searchInput" placeholder="Cari komik..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" aria-label="Cari"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <button class="hamburger" onclick="toggleMobileMenu(this)" aria-label="Buka menu navigasi" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<main class="container" id="app"></main>

<footer>
  <div class="fword">Komik Kita</div>
  <p>© 2026 KOMIK KITA — BACA KOMIK TANPA BATAS</p>
</footer>

<script>
/* ============================================================
   KONFIGURASI API — sesuaikan dengan backend kamu
   ============================================================ */
const API_BASE = 'https://backend-komik.rayhanwlndr9.workers.dev';

const ENDPOINTS = {
  rekomendasi: `${API_BASE}/rekomendasi`,
  terbaru:     `${API_BASE}/terbaru`,
  populer:     `${API_BASE}/populer`,
  pustaka:     `${API_BASE}/pustaka`,
  genre:       `${API_BASE}/genre`,
  detail:      (slug) => `${API_BASE}/detail/${slug}`,
  chapter:     (slug) => `${API_BASE}/chapter/${slug}`,
  search:      (q)    => `${API_BASE}/search/${encodeURIComponent(q)}`,
};

/* ============================================================ */

const app = document.getElementById('app');
const HISTORY_KEY = 'komikkita_history';

function toggleMobileMenu(button){
  const menu = document.getElementById('navMenu');
  const isOpen = menu.classList.toggle('open');
  button.setAttribute('aria-expanded', String(isOpen));
  button.setAttribute('aria-label', isOpen ? 'Tutup menu navigasi' : 'Buka menu navigasi');
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSlug(item){return item.slug||item.link||item.url||''}
function getCover(item){return item.cover||item.image||item.thumb||item.thumbnail||''}
function getTitle(item){return item.title||item.name||'Tanpa Judul'}
function getChapter(item){return item.chapter||item.latest_chapter||item.ch||''}
function getType(item){return item.type||item.jenis||''}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

function normalizeList(data){
  if(Array.isArray(data)) return data;
  for(const k of ['data','results','result','list','komik','manga','items']){
    if(Array.isArray(data?.[k])) return data[k];
  }
  return [];
}

function addHistory(item){
  try{
    const slug = getSlug(item); if(!slug) return;
    let h = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    h = h.filter(x=>getSlug(x)!==slug);
    h.unshift({slug:getSlug(item),title:getTitle(item),cover:getCover(item),chapter:getChapter(item),type:getType(item),ts:Date.now()});
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0,60)));
  }catch(e){}
}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return[]}}

function loadingHTML(msg='Memuat koleksi'){return `<div class="loading"><div class="loader-mark">${msg}…</div></div>`}
function emptyHTML(icon,msg){return `<div class="empty"><i class="${icon}"></i><p>${msg}</p></div>`}
function errorHTML(){return emptyHTML('fa-solid fa-triangle-exclamation','Gagal memuat data. Periksa koneksi atau coba lagi nanti.')}

function sectionHead(title,em,count){
  return `<div class="section-head"><h2>${esc(title)} ${em?`<em>${esc(em)}</em>`:''}</h2>${count!=null?`<span class="count">${count} judul</span>`:''}</div>`;
}

function cardHTML(item,i,rank=false){
  const slug = getSlug(item);
  return `<article class="card" onclick="openDetail('${esc(slug)}')">
    <div class="thumb">
      ${rank?`<span class="rank">#${i+1}</span>`:''}
      ${getType(item)?`<span class="chip">${esc(getType(item))}</span>`:''}
      <img src="${esc(getCover(item))}" alt="${esc(getTitle(item))}" loading="lazy" onerror="this.style.opacity=.15">
    </div>
    <div class="card-meta">
      <h3>${esc(getTitle(item))}</h3>
      <div class="sub">${getChapter(item)?`<i class="fa-solid fa-book-open"></i> Ch. ${esc(getChapter(item))}`:''}</div>
    </div>
  </article>`;
}

function gridHTML(items,rank=false){
  if(!items.length) return emptyHTML('fa-regular fa-folder-open','Belum ada komik untuk ditampilkan.');
  return `<div class="grid">${items.map((it,i)=>cardHTML(it,i,rank)).join('')}</div>`;
}

/* ============ VIEWS ============ */

async function loadView(view,param){
  document.getElementById('navMenu').classList.remove('open');
  window.scrollTo({top:0});
  const base = view.split('/')[0];
  setActiveNav(base);

  if(view==='home') return viewHome();
  if(view==='populer') return viewList('populer','Paling','Populer',ENDPOINTS.populer,true);
  if(view==='terbaru') return viewList('terbaru','Rilisan','Terbaru',ENDPOINTS.terbaru);
  if(view==='pustaka') return viewList('pustaka','Pustaka','Lengkap',ENDPOINTS.pustaka);
  if(view==='genre'&&param) return viewGenreKomik(param);
  if(view==='genre') return viewGenre();
  if(view==='riwayat') return viewRiwayat();
  if(view==='search'&&param) return viewSearch(param);
  if(view==='detail'&&param) return viewDetail(param);
  if(view==='read'&&param) return viewReader(param);
  viewHome();
}

function setActiveNav(view){
  document.querySelectorAll('.nav-menu .nav-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.toLowerCase()===({home:'beranda'})[view]||b.getAttribute('onclick')?.includes(`'${view}'`));
  });
}

async function viewHome(){
  app.innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">Platform Baca Komik</div>
      <h1>Cerita terbaik,<br>disajikan dengan <em>rasa.</em></h1>
      <p>Koleksi manga, manhwa, dan manhua pilihan — dikurasi setiap hari, diperbarui secepat rilisan aslinya.</p>
      <div class="hero-cta">
        <button class="btn btn-gold" onclick="loadView('terbaru')">Mulai Membaca <i class="fa-solid fa-arrow-right"></i></button>
        <button class="btn btn-ghost" onclick="loadView('pustaka')">Jelajahi Pustaka</button>
      </div>
    </div>
    <aside class="hero-side">
      <div class="hero-stats">
        <div class="stat"><div class="num" id="statTotal">—</div><div class="lbl">Judul Aktif</div></div>
        <div class="stat"><div class="num">24/7</div><div class="lbl">Update Rilis</div></div>
        <div class="stat"><div class="num">HD</div><div class="lbl">Kualitas Gambar</div></div>
      </div>
    </aside>
  </section>
  ${sectionHead('Rekomendasi','Pilihan')}
  <div id="homeRekom">${loadingHTML()}</div>
  ${sectionHead('Baru','Rilis')}
  <div id="homeBaru">${loadingHTML()}</div>`;

  try{
    const [rek,baru] = await Promise.all([
      fetchJSON(ENDPOINTS.rekomendasi).then(normalizeList),
      fetchJSON(ENDPOINTS.terbaru).then(normalizeList),
    ]);
    document.getElementById('homeRekom').innerHTML = gridHTML(rek.slice(0,12));
    document.getElementById('homeBaru').innerHTML = gridHTML(baru.slice(0,12));
    const el = document.getElementById('statTotal');
    if(el) el.textContent = (rek.length+baru.length)+'+';
  }catch(e){
    document.getElementById('homeRekom').innerHTML = errorHTML();
    document.getElementById('homeBaru').innerHTML = '';
  }
}

async function viewList(key,t1,t2,url,rank=false){
  app.innerHTML = sectionHead(t1,t2)+`<div id="list">${loadingHTML()}</div>`;
  try{
    const items = normalizeList(await fetchJSON(url));
    app.innerHTML = sectionHead(t1,t2,items.length)+gridHTML(items,rank);
  }catch(e){ app.innerHTML = sectionHead(t1,t2)+errorHTML(); }
}

async function viewGenre(){
  app.innerHTML = sectionHead('Jelajahi','Genre')+`<div id="glist">${loadingHTML()}</div>`;
  try{
    const raw = await fetchJSON(ENDPOINTS.genre);
    const genres = normalizeList(raw);
    if(!genres.length) throw 0;
    document.getElementById('glist').outerHTML = `<div class="genre-grid">${genres.map(g=>{
      const name = g.name||g.title||g.genre||'';
      const slug = g.slug||name;
      const count = g.count||g.total||'';
      return `<div class="genre-tile" onclick="loadView('genre','${esc(slug)}')">
        <div class="gname">${esc(name)}</div>
        ${count?`<div class="gcount">${esc(count)} komik</div>`:''}
        <i class="fa-solid fa-arrow-right"></i>
      </div>`;
    }).join('')}</div>`;
  }catch(e){
    document.getElementById('glist').outerHTML = errorHTML();
  }
}

async function viewGenreKomik(slug){
  app.innerHTML = sectionHead('Genre',slug)+`<div id="gkomik">${loadingHTML()}</div>`;
  try{
    const items = normalizeList(await fetchJSON(`${ENDPOINTS.genre}/${encodeURIComponent(slug)}`));
    app.innerHTML = sectionHead('Genre',slug,items.length)+gridHTML(items);
  }catch(e){ app.innerHTML = sectionHead('Genre',slug)+errorHTML(); }
}

function viewRiwayat(){
  const h = getHistory();
  app.innerHTML = sectionHead('Riwayat','Baca',h.length)+(
    h.length
      ? `<div class="list">${h.map(it=>`
        <div class="row" onclick="openDetail('${esc(it.slug)}')">
          <img src="${esc(it.cover)}" alt="${esc(it.title)}" loading="lazy" onerror="this.style.opacity=.15">
          <div><div class="rtitle">${esc(it.title)}</div><div class="rsub">${it.chapter?`Terakhir: Ch. ${esc(it.chapter)}`:'Lanjutkan membaca'}</div></div>
          <i class="fa-solid fa-arrow-right go"></i>
        </div>`).join('')}</div>`
      : emptyHTML('fa-solid fa-clock-rotate-left','Riwayat masih kosong. Komik yang kamu buka akan tercatat di sini.')
  );
}

async function viewSearch(q){
  app.innerHTML = sectionHead('Hasil untuk',`"${q}"`)+`<div id="sres">${loadingHTML('Mencari')}</div>`;
  try{
    const items = normalizeList(await fetchJSON(ENDPOINTS.search(q)));
    app.innerHTML = sectionHead('Hasil untuk',`"${q}"`,items.length)+gridHTML(items);
  }catch(e){ app.innerHTML = sectionHead('Hasil untuk',`"${q}"`)+errorHTML(); }
}

function doSearchMobile(){
  const q = document.getElementById('searchInputMobile').value.trim();
  if(q) loadView('search',q);
}

function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(q) loadView('search',q);
}

function openDetail(slug){ if(slug) loadView('detail',slug); }

async function viewDetail(slug){
  app.innerHTML = loadingHTML('Membuka detail');
  try{
    const d = await fetchJSON(ENDPOINTS.detail(slug));
    const data = d.data||d.result||d;
    const chapters = normalizeList(data.chapters||data.chapter_list||[]);
    addHistory({slug,title:getTitle(data),cover:getCover(data),chapter:chapters[0]?(chapters[0].chapter||chapters[0].title||''):'',type:getType(data)});

    const genres = (data.genres||data.genre||[]);
    app.innerHTML = `
    <button class="back-link" onclick="history.length>1?loadView('home'):loadView('home')"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    <div class="detail">
      <div class="detail-cover"><img src="${esc(getCover(data))}" alt="${esc(getTitle(data))}" onerror="this.style.opacity=.15"></div>
      <div>
        <h1>${esc(getTitle(data))}</h1>
        <div class="badges">
          ${getType(data)?`<span class="badge gold">${esc(getType(data))}</span>`:''}
          ${data.status?`<span class="badge">${esc(data.status)}</span>`:''}
          ${(Array.isArray(genres)?genres:[]).slice(0,6).map(g=>`<span class="badge">${esc(g.name||g)}</span>`).join('')}
        </div>
        <p class="desc">${esc(data.synopsis||data.description||data.sinopsis||'Belum ada sinopsis untuk judul ini.')}</p>
        <div class="hero-cta">
          ${chapters.length?`<button class="btn btn-gold" onclick="loadView('read','${esc(getSlug(chapters[chapters.length-1])||chapters[chapters.length-1].slug||'')}')"><i class="fa-solid fa-book-open"></i> Mulai Ch. 1</button>`:''}
        </div>
        <div class="chapters">
          <h3>Daftar Chapter <span style="color:var(--muted);font-size:14px;font-family:var(--sans)">(${chapters.length})</span></h3>
          ${chapters.length?chapters.map(c=>{
            const cslug = c.slug||getSlug(c);
            const label = c.title||c.chapter||c.num||cslug;
            return `<div class="ch-item" onclick="loadView('read','${esc(cslug)}')">
              <span>Chapter ${esc(label)}</span>
              <span class="num">${esc(c.date||c.released||'')} <i class="fa-solid fa-chevron-right" style="font-size:10px"></i></span>
            </div>`;
          }).join(''):emptyHTML('fa-regular fa-file-lines','Belum ada chapter tersedia.')}
        </div>
      </div>
    </div>`;
  }catch(e){ app.innerHTML = errorHTML(); }
}

async function viewReader(slug){
  app.innerHTML = loadingHTML('Membuka chapter');
  try{
    const d = await fetchJSON(ENDPOINTS.chapter(slug));
    const data = d.data||d.result||d;
    const images = data.images||data.image||data.pages||[];
    const title = data.title||data.komik_title||'Chapter';
    app.innerHTML = `
    <div class="reader">
      <div class="reader-head">
        <button class="back-link" onclick="loadView('pustaka')"><i class="fa-solid fa-arrow-left"></i> Pustaka</button>
        <h2>${esc(title)}</h2>
        <p>${esc(data.chapter||data.chapter_title||slug)}</p>
      </div>
      ${Array.isArray(images)&&images.length
        ? images.map(src=>`<img src="${esc(src.url||src)}" alt="Halaman" loading="lazy" onerror="this.style.display='none'">`).join('')
        : emptyHTML('fa-regular fa-image','Gambar chapter tidak tersedia.')}
      <div class="reader-nav">
        <button class="btn btn-ghost" onclick="loadView('pustaka')"><i class="fa-solid fa-list"></i> Semua Komik</button>
        <button class="btn btn-gold" onclick="window.scrollTo({top:0,behavior:'smooth'})">Ke Atas <i class="fa-solid fa-arrow-up"></i></button>
      </div>
    </div>`;
  }catch(e){ app.innerHTML = errorHTML(); }
}

loadView('home');
</script>
